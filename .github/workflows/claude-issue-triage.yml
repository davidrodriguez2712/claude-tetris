name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repo (Tetris en JS vanilla, ver CLAUDE.md para arquitectura).

            Pasos:
            1. Lee título y body del issue.
            2. Revisa código relevante en el repo (game.js, index.html, style.css) para entender la causa probable.
            3. Corre `gh label list` para ver labels disponibles y asigna las que apliquen con `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"` (usa solo labels default: bug, enhancement, documentation, question, duplicate, invalid, wontfix, help wanted, good first issue).
            4. Postea un comment en el issue con `gh issue comment ${{ github.event.issue.number }} --body "..."` que incluya:
               - Diagnóstico general del problema (causa probable)
               - Archivos/funciones afectadas (ej. game.js: collide(), tryRotate(), etc.)
               - Approach sugerido para el fix (sin implementarlo)
            No edites el código ni crees PR — solo labels + comment de diagnóstico.
          claude_args: '--allowed-tools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'
